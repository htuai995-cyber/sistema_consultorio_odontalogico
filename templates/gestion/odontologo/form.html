{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
  <div class="card-header">
    <span class="card-title"><i class="fas fa-user-md" style="color:var(--primary)"></i> {{ titulo }}</span>
    <a href="{% url 'odontologo_lista' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver</a>
  </div>
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="grid-cols-2">
        {% for field in form %}
        <div class="form-group {% if field.name == 'descripcion' or field.name == 'observaciones' %}{% endif %}">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="invalid-feedback" style="display:block;">{{ e }}</div>{% endfor %}
        </div>
        {% endfor %}
      </div>
      <div class="d-flex gap-3" style="margin-top: 0.5rem;">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {{ accion }}</button>
        <a href="{% url 'odontologo_lista' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
