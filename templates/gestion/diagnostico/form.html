{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
  <div class="card-header">
    <span class="card-title"><i class="fas fa-notes-medical" style="color:var(--primary)"></i> {{ titulo }}</span>
    <a href="{% url 'diagnostico_lista' %}" class="btn btn-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver</a>
  </div>
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% for field in form %}
      <div class="form-group">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% for e in field.errors %}<div class="invalid-feedback" style="display:block;">{{ e }}</div>{% endfor %}
      </div>
      {% endfor %}
      <div class="d-flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {{ accion }}</button>
        <a href="{% url 'diagnostico_lista' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
